[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
license = "MIT"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
parley = "0.12"
krilla = "0.8"
skrifa = "0.44"
tiny-skia = "0.12"
unicode-segmentation = "1"
pulldown-cmark = "0.13"
