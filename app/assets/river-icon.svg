    <path d="M462 578 q26 -16 52 0 t52 0" stroke="#163f50" stroke-width="22"/>
    <path d="M412 638 q30 -18 60 0 t60 0 t60 0" stroke="#2f8aa5" stroke-width="22"/>
    <path d="M412 698 q30 -18 60 0 t60 0" stroke="#2f8aa5" stroke-width="22"/>
