  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="292" y="210" width="440" height="604" rx="30" fill="url(#paper)" filter="url(#shadow)"/>
  <g fill="none" stroke-linecap="round">
